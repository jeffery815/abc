<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>週考練習測驗</title>


    <style>

        /* =================================
           基本設定
        ================================= */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;

            /* 只告訴瀏覽器這是一般操作 */
            touch-action: manipulation;
        }


        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: #f2f4f7;

            color: #222;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans TC",
                sans-serif;

            -webkit-user-select: none;
            user-select: none;

            -webkit-touch-callout: none;
        }


        /* =================================
           主容器
        ================================= */

        .container {
            width: 100%;
            max-width: 600px;

            margin: 0 auto;

            padding:
                20px
                16px
                50px;
        }


        /* =================================
           標題
        ================================= */

        h1 {
            text-align: center;

            font-size: 28px;

            margin:
                10px
                0
                25px;
        }


        /* =================================
           卡片
        ================================= */

        .card {
            background: white;

            border-radius: 18px;

            padding: 20px;

            margin-bottom: 18px;

            box-shadow:
                0 4px 14px
                rgba(0, 0, 0, 0.08);
        }


        /* =================================
           按鈕
        ================================= */

        button {
            display: block;

            width: 100%;

            min-height: 54px;

            padding:
                12px
                16px;

            margin-top: 10px;

            border: none;

            border-radius: 14px;

            font-size: 18px;

            font-weight: 600;

            cursor: pointer;

            background: #e9eef5;

            color: #222;

            /*
             * 這裡保留 manipulation，
             * 不再用 touchend 去攔截快速點擊。
             */
            touch-action: manipulation;

            -webkit-appearance: none;
            appearance: none;

            -webkit-user-select: none;
            user-select: none;

            -webkit-touch-callout: none;

            outline: none;

            -webkit-tap-highlight-color:
                transparent;

            transition:
                transform 0.05s ease,
                opacity 0.05s ease;
        }


        button:active {
            transform: scale(0.97);
            opacity: 0.82;
        }


        /* =================================
           按鈕樣式
        ================================= */

        .random-btn {
            background: #222;
            color: white;

            margin-bottom: 22px;
        }


        .question-btn {
            background: #e9eef5;
            color: #222;
        }


        .answer-btn {
            background: #3b82f6;
            color: white;
        }


        .hint-btn {
            background: #f4c430;
            color: #222;
        }


        .next-btn {
            background: #22a06b;
            color: white;
        }
        
.prev-btn {
    background: #64748b;
    color: white;
}

        .back-btn {
            background: #777;
            color: white;
        }


        /* =================================
           選單標題
        ================================= */

        .menu-title {
            font-size: 20px;

            font-weight: 700;

            margin-bottom: 10px;
        }


        /* =================================
           題號
        ================================= */

        .question-number {
            text-align: center;

            font-size: 16px;

            color: #777;

            margin-bottom: 10px;
        }


        /* =================================
           題目
        ================================= */

        .question {
            font-size: 22px;

            font-weight: 700;

            line-height: 1.6;

            background: #f8fafc;

            padding: 18px;

            border-radius: 14px;

            margin-bottom: 15px;

            word-break: break-word;
        }


        /* =================================
           完整答案
        ================================= */

        .answer {
            margin-top: 18px;

            padding: 18px;

            background: #f0fdf4;

            border-radius: 14px;

            font-size: 20px;

            line-height: 1.7;

            white-space: pre-wrap;

            word-break: break-word;
        }


        /* =================================
           一字提示
        ================================= */

        .hint-answer {
            margin-top: 18px;

            padding: 18px;

            background: #fffbea;

            border-radius: 14px;

            font-size: 22px;

            line-height: 1.8;

            word-break: break-all;

            text-align: left;

            letter-spacing: 1px;

            min-height: 60px;
        }


        /* =================================
           隱藏
        ================================= */

        .hidden {
            display: none !important;
        }


        /* =================================
           小螢幕
        ================================= */

        @media (max-width: 380px) {

            .container {
                padding-left: 12px;
                padding-right: 12px;
            }


            h1 {
                font-size: 25px;
            }


            .question {
                font-size: 20px;
            }


            button {
                font-size: 17px;
            }


            .hint-answer {
                font-size: 20px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =================================
         首頁
    ================================= -->

    <div id="homePage">
        <h1>
            ⚔️戰術題庫（步兵）測驗
        </h1>


        <div class="card">

            <button
                id="randomButton"
                class="random-btn"
                type="button">

                🎲 隨機出題

            </button>


            <div class="menu-title">
                📖 選擇題目
            </div>


            <div id="questionList"></div>

        </div>

    </div>



    <!-- =================================
         測驗頁
    ================================= -->

    <div
        id="quizPage"
        class="hidden">

        <div class="card">
            <div
                id="questionNumber"
                class="question-number">
            </div>


            <div
                id="questionText"
                class="question">
            </div>



            <!-- =================================
                 完整答案
            ================================= -->

            <button
                id="answerButton"
                class="answer-btn"
                type="button">

                🔵 顯示完整答案

            </button>


            <div
                id="fullAnswer"
                class="answer hidden">
            </div>



            <!-- =================================
                 一個字一個字提示
            ================================= -->

            <button
                id="hintButton"
                class="hint-btn"
                type="button">

                🟡 一個字一個字提示

            </button>


            <div
                id="hintAnswer"
                class="hint-answer hidden">
            </div>


<button
    id="prevButton"
    class="prev-btn"
    type="button">

    ⬅️ 上一題

</button>
            <!-- =================================
                 下一題
            ================================= -->

            <button
                id="nextButton"
                class="next-btn"
                type="button">

                ➡️ 下一題

            </button>



            <!-- =================================
                 回首頁
            ================================= -->

            <button
                id="backButton"
                class="back-btn"
                type="button">

                ← 回到題目選擇

            </button>


        </div>

    </div>


</div>



<script>


/* ==========================================
   題目
========================================== */

const questions = [

    {
        question:
            "野戰要務為何？",

        answer:
                "搜索、偵查、觀測、警戒、掩護、連絡。"
    },


    {
        question:
            "敵情偵查之目的為何？",

        answer:
            "在於查知敵軍弱點，尋求破敵機會。"
    },


    {
        question:
            "地形偵查之目的為何？",

        answer:
            "在明瞭地形特性，俾能能用其利而去其弊，發揮我戰力、限制敵戰力，以達殲敵之目的。"
    },


    {
        question:
            "搜索之區分為何？",

        answer:
            "偵察搜索、戰鬥搜索。"
    },


    {
        question:
            "搜索依任務區分為何？",

        answer:
            "(1)道路搜索。\n(2)區域搜索。\n(3)局地搜索。"
    },
    
    
    {
        question:
            "搜索編組為何？",

        answer:
            "(1)指揮組。\n(2)搜索組。\n(3)掩護組。\n(4)支援組。"
    },
    
    
    {
    question:
        "排搜索計畫內容為何？",

    answer:
        "(1)搜索目標。\n(2)搜索階段區分。\n(3)搜索路線。\n(4)管制點。\n(5)觀測站。\n(6)歸還路線。\n(7)集合點。\n(8)連絡點。"
},
{
    question:
        "部隊指揮程序為何？",

    answer:
        "(1)受領任務。\n(2)下達預備命令。\n(3)擬定初步計畫。\n(4)處置下列事項。\n(5)實施偵察。\n(6)完成計畫。\n(7)下達命令。\n(8)督導寶施。"
},
{
    question:
        "命令五大格式為何？",

    answer:
        "(1)狀況。\n(2)任務。\n(3)執行。\n(4)勤務支援與政戰。\n(5)指揮與通信電子。"
},
{
    question:
        "行軍依速度區分為何？",

    answer:
        "常行軍、急行軍、強行軍。"
}
];



/* ==========================================
   測驗狀態
========================================== */

let currentQuestion = 0;

let quizOrder = [];

let revealedCount = 0;



/* ==========================================
   DOM
========================================== */

const homePage =
    document.getElementById("homePage");

const quizPage =
    document.getElementById("quizPage");

const questionList =
    document.getElementById("questionList");

const questionNumber =
    document.getElementById("questionNumber");

const questionText =
    document.getElementById("questionText");

const fullAnswer =
    document.getElementById("fullAnswer");

const hintAnswer =
    document.getElementById("hintAnswer");

const hintButton =
    document.getElementById("hintButton");

const answerButton =
    document.getElementById("answerButton");

const nextButton =
    document.getElementById("nextButton");
    
const prevButton =
    document.getElementById("prevButton");
    
const backButton =
    document.getElementById("backButton");

const randomButton =
    document.getElementById("randomButton");



/* ==========================================
   建立題目選單
========================================== */

function createQuestionList() {

    questionList.innerHTML = "";


    questions.forEach(
        function(item, index) {

            const button =
                document.createElement("button");


            button.type = "button";

            button.className =
                "question-btn";


            button.textContent =
                "第 " +
                (index + 1) +
                " 題";


            button.addEventListener(
                "click",
                function() {

                    startQuiz(index);

                }
            );


            questionList.appendChild(button);

        }
    );

}



/* ==========================================
   開始題目
========================================== */

function startQuiz(index) {

    quizOrder =
        questions.map(
            function(_, i) {
                return i;
            }
        );


    currentQuestion = index;


    showQuizPage();

}



/* ==========================================
   隨機出題
========================================== */

function startRandomQuiz() {

    quizOrder =
        questions.map(
            function(_, i) {
                return i;
            }
        );


    shuffleArray(quizOrder);


    currentQuestion = 0;


    showQuizPage();

}



/* ==========================================
   洗牌
========================================== */

function shuffleArray(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

}



/* ==========================================
   顯示測驗頁
========================================== */

function showQuizPage() {

    homePage.classList.add(
        "hidden"
    );


    quizPage.classList.remove(
        "hidden"
    );


    loadQuestion();


    window.scrollTo(
        0,
        0
    );

}



/* ==========================================
   載入題目
========================================== */

function loadQuestion() {

    const questionIndex =
        quizOrder[currentQuestion];


    const item =
        questions[questionIndex];


    questionNumber.textContent =
        "第 " +
        (currentQuestion + 1) +
        " / " +
        quizOrder.length +
        " 題";


    questionText.textContent =
        item.question;


    /* 清除完整答案 */

    fullAnswer.textContent = "";

    fullAnswer.classList.add(
        "hidden"
    );


    /* 清除提示 */

    hintAnswer.textContent = "";

    hintAnswer.classList.add(
        "hidden"
    );


    revealedCount = 0;


    hintButton.textContent =
        "🟡 一個字一個字提示";

}



/* ==========================================
   完整答案
========================================== */

function showFullAnswer() {

    const questionIndex =
        quizOrder[currentQuestion];


    const answer =
        questions[questionIndex].answer;


    fullAnswer.textContent =
        answer;


    fullAnswer.classList.remove(
        "hidden"
    );

}



/* ==========================================
   判斷是否為標點
========================================== */

function isPunctuation(char) {

    return /[\s.,!?，。！？、；：：「」『』（）()【】《》〈〉…—\-_]/.test(
        char
    );

}



/* ==========================================
   產生提示文字
========================================== */

function buildHint(answer, count) {

    let result = "";


    for (
        let i = 0;
        i < answer.length;
        i++
    ) {

        const char =
            answer[i];


        /*
         * 已經顯示
         */

        if (i < count) {

            result += char;

        }


        /*
         * 標點符號自動顯示
         */

        else if (
            isPunctuation(char)
        ) {

            result += char;

        }


        /*
         * 尚未顯示
         */

        else {

            result += "＿";

        }

    }


    return result;

}



/* ==========================================
   一個字一個字提示
========================================== */

function showNextCharacter() {

    const questionIndex =
        quizOrder[currentQuestion];


    const answer =
        questions[questionIndex].answer;


    hintAnswer.classList.remove(
        "hidden"
    );


    /*
     * 先跳過標點
     */

    while (
        revealedCount < answer.length &&
        isPunctuation(
            answer[revealedCount]
        )
    ) {

        revealedCount++;

    }


    /*
     * 已經完成
     */

    if (
        revealedCount >= answer.length
    ) {

        hintAnswer.textContent =
            answer;


        hintButton.textContent =
            "✅ 已全部提示";


        return;

    }


    /*
     * 顯示一個字
     */

    revealedCount++;


    /*
     * 顯示完這個字後，
     * 直接跳過後面的標點
     */

    while (
        revealedCount < answer.length &&
        isPunctuation(
            answer[revealedCount]
        )
    ) {

        revealedCount++;

    }


    /*
     * 更新畫面
     */

    hintAnswer.textContent =
        buildHint(
            answer,
            revealedCount
        );


    /*
     * 完成
     */

    if (
        revealedCount >= answer.length
    ) {

        hintButton.textContent =
            "✅ 已全部提示";

    }

}



/* ==========================================
   下一題
========================================== */

function nextQuestion() {

    if (
        currentQuestion <
        quizOrder.length - 1
    ) {

        currentQuestion++;

        loadQuestion();

        window.scrollTo(
            0,
            0
        );

    }

    else {

        alert(
            "🎉 已經完成所有題目！"
        );


        backToHome();

    }

}

/* ==========================================
   上一題
========================================== */

function prevQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        loadQuestion();

        window.scrollTo(
            0,
            0
        );

    }

    else {

        alert("你在第一題！");

    }

}

/* ==========================================
   回首頁
========================================== */

function backToHome() {

    quizPage.classList.add(
        "hidden"
    );


    homePage.classList.remove(
        "hidden"
    );


    window.scrollTo(
        0,
        0
    );

}



/* ==========================================
   按鈕事件
========================================== */

randomButton.addEventListener(
    "click",
    function() {

        startRandomQuiz();

    }
);


answerButton.addEventListener(
    "click",
    function() {

        showFullAnswer();

    }
);


/*
 * ⭐ 這裡是最重要的地方
 *
 * 直接使用 click。
 *
 * 不使用 touchstart。
 * 不使用 touchend。
 * 不使用全域 touchend 攔截。
 *
 * 這樣快速連點時，
 * 每一次 click 都可以正常執行。
 */

hintButton.addEventListener(
    "click",
    function() {

        showNextCharacter();

    }
);


nextButton.addEventListener(
    "click",
    function() {

        nextQuestion();

    }
);

prevButton.addEventListener(
    "click",
    function() {

        prevQuestion();

    }
);

backButton.addEventListener(
    "click",
    function() {

        backToHome();

    }
);



/* ==========================================
   iPhone Safari 手勢處理
========================================== */

/*
 * 不攔截 touchend。
 *
 * 不攔截 dblclick。
 *
 * 不會影響快速按鈕。
 *
 * 只阻止 Safari 的 pinch gesture。
 */


document.addEventListener(
    "gesturestart",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gesturechange",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gestureend",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);



/* ==========================================
   初始化
========================================== */

createQuestionList();

</script>

<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", function() {
            navigator.serviceWorker.register("./sw.js")
                .then(function(registration) {
                    console.log("離線功能已啟用");
                })
                .catch(function(error) {
                    console.log("離線功能啟用失敗:", error);
                });
        });
    }
</script>
<!-- 額外題目：將這整段貼在原本 index.html 最後的 </body> 前面 -->
<style>
  #extraQuestionPage .extra-controls button { margin-top: 12px; }
  #extraQuestionPage .extra-answer { white-space: pre-wrap; line-height: 1.8; }
  #extraQuestionButton {
    margin-top: 12px;
    background-color: #2879D0 !important;
    color: #FFFFFF !important;
}
</style>
<script>
(() => {
  'use strict';
  const title = '國軍教戰總則第十一條';
  const answer = '機動作戰作戰以殲滅敵人有生力量為主旨，應以旺盛之企圖、靈活之指揮運用、迅速之兵力分合，臨機獨斷，創造決戰時空之戰力優勢，乘機捕殲滅敵人。且作戰全程，掌握主動，以我之意志支配戰場，並講求指揮、運動、攻擊及戰力整備諸速度，以高度之機動作戰，壓倒殲滅敵人，期獲致決定性之勝利。';
  const home = document.getElementById('homePage');
  const quiz = document.getElementById('quizPage');
  const random = document.getElementById('randomButton');
  if (!home || !quiz || !random) return;
  const btn = document.createElement('button');
  btn.id = 'extraQuestionButton';
  btn.type = 'button';
  btn.className = 'question-btn';
  btn.textContent = '📝 國軍教戰總則';
  random.insertAdjacentElement('afterend', btn);
  const page = document.createElement('div');
  page.id = 'extraQuestionPage';
  page.className = 'hidden';
  page.innerHTML = `
    <div class="card">
      <div class="question"></div>
      <div class="extra-controls">
        <button type="button" class="answer-btn" id="extraShowAnswer">🔵 顯示完整答案</button>
        <div id="extraFullAnswer" class="answer extra-answer hidden"></div>
        <button type="button" class="hint-btn" id="extraHint">🟡 一個字一個字提示</button>
        <div id="extraHintAnswer" class="hint-answer extra-answer hidden"></div>
        <button type="button" class="back-btn" id="extraBack">← 回到題目選擇</button>
      </div>
    </div>`;
  quiz.insertAdjacentElement('afterend', page);
  page.querySelector('.question').textContent = title;
  const full = page.querySelector('#extraFullAnswer');
  const hint = page.querySelector('#extraHintAnswer');
  const hintBtn = page.querySelector('#extraHint');
  const chars = Array.from(answer);
  let count = 0;
  const punctuation = /[\s.,!?，。！？、；：：「」『』（）()〖〗《》〈〉…—\-_]/;
  btn.addEventListener('click', () => {
    count = 0;
    full.textContent = '';
    full.classList.add('hidden');
    hint.textContent = '';
    hint.classList.add('hidden');
    hintBtn.textContent = '🟡 一個字一個字提示';
    home.classList.add('hidden');
    quiz.classList.add('hidden');
    page.classList.remove('hidden');
    window.scrollTo(0, 0);
  });
  page.querySelector('#extraShowAnswer').addEventListener('click', () => {
    full.textContent = answer;
    full.classList.remove('hidden');
  });
  hintBtn.addEventListener('click', () => {
    if (count >= chars.length) return;
    count++;
    while (count < chars.length && punctuation.test(chars[count])) count++;
    hint.textContent = chars.slice(0, count).join('');
    hint.classList.remove('hidden');
    if (count >= chars.length) hintBtn.textContent = '✅ 提示完成';
  });
  page.querySelector('#extraBack').addEventListener('click', () => {
    page.classList.add('hidden');
    quiz.classList.add('hidden');
    home.classList.remove('hidden');
    window.scrollTo(0, 0);
  });
})();
</script>

</body>

</html>
