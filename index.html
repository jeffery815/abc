/* ==========================================
   建立題目選單
========================================== */

function createQuestionList() {

    questionList.innerHTML = "";


    questions.forEach(
        function(item, index) {

            const button =
                document.createElement("button");


            button.type = "button";

            button.className =
                "question-btn";


            button.textContent =
                "第 " +
                (index + 1) +
                " 題";


            button.addEventListener(
                "click",
                function() {

                    startQuiz(index);

                }
            );


            questionList.appendChild(button);

        }
    );

}



/* ==========================================
   開始題目
========================================== */

function startQuiz(index) {

    quizOrder =
        questions.map(
            function(_, i) {
                return i;
            }
        );


    currentQuestion = index;


    showQuizPage();

}



/* ==========================================
   隨機出題
========================================== */

function startRandomQuiz() {

    quizOrder =
        questions.map(
            function(_, i) {
                return i;
            }
        );


    shuffleArray(quizOrder);


    currentQuestion = 0;


    showQuizPage();

}



/* ==========================================
   洗牌
========================================== */

function shuffleArray(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

}



/* ==========================================
   顯示測驗頁
========================================== */

function showQuizPage() {

    homePage.classList.add(
        "hidden"
    );


    quizPage.classList.remove(
        "hidden"
    );


    loadQuestion();


    window.scrollTo(
        0,
        0
    );

}



/* ==========================================
   載入題目
========================================== */

function loadQuestion() {

    const questionIndex =
        quizOrder[currentQuestion];


    const item =
        questions[questionIndex];


    questionNumber.textContent =
        "第 " +
        (currentQuestion + 1) +
        " / " +
        quizOrder.length +
        " 題";


    questionText.textContent =
        item.question;


    /* 清除完整答案 */

    fullAnswer.textContent = "";

    fullAnswer.classList.add(
        "hidden"
    );


    /* 清除提示 */

    hintAnswer.textContent = "";

    hintAnswer.classList.add(
        "hidden"
    );


    revealedCount = 0;


    hintButton.textContent =
        "🟡 一個字一個字提示";

}



/* ==========================================
   完整答案
========================================== */

function showFullAnswer() {

    const questionIndex =
        quizOrder[currentQuestion];


    const answer =
        questions[questionIndex].answer;


    fullAnswer.textContent =
        answer;


    fullAnswer.classList.remove(
        "hidden"
    );

}



/* ==========================================
   判斷是否為標點
========================================== */

function isPunctuation(char) {

    return /[\s.,!?，。！？、；：：「」『』（）()【】《》〈〉…—\-_]/.test(
        char
    );

}



/* ==========================================
   產生提示文字
========================================== */

function buildHint(answer, count) {

    let result = "";


    for (
        let i = 0;
        i < answer.length;
        i++
    ) {

        const char =
            answer[i];


        /*
         * 已經顯示
         */

        if (i < count) {

            result += char;

        }


        /*
         * 標點符號自動顯示
         */

        else if (
            isPunctuation(char)
        ) {

            result += char;

        }


        /*
         * 尚未顯示
         */

        else {

            result += "＿";

        }

    }


    return result;

}



/* ==========================================
   一個字一個字提示
========================================== */

function showNextCharacter() {

    const questionIndex =
        quizOrder[currentQuestion];


    const answer =
        questions[questionIndex].answer;


    hintAnswer.classList.remove(
        "hidden"
    );


    /*
     * 先跳過標點
     */

    while (
        revealedCount < answer.length &&
        isPunctuation(
            answer[revealedCount]
        )
    ) {

        revealedCount++;

    }


    /*
     * 已經完成
     */

    if (
        revealedCount >= answer.length
    ) {

        hintAnswer.textContent =
            answer;


        hintButton.textContent =
            "✅ 已全部提示";


        return;

    }


    /*
     * 顯示一個字
     */

    revealedCount++;


    /*
     * 顯示完這個字後，
     * 直接跳過後面的標點
     */

    while (
        revealedCount < answer.length &&
        isPunctuation(
            answer[revealedCount]
        )
    ) {

        revealedCount++;

    }


    /*
     * 更新畫面
     */

    hintAnswer.textContent =
        buildHint(
            answer,
            revealedCount
        );


    /*
     * 完成
     */

    if (
        revealedCount >= answer.length
    ) {

        hintButton.textContent =
            "✅ 已全部提示";

    }

}



/* ==========================================
   下一題
========================================== */

function nextQuestion() {

    if (
        currentQuestion <
        quizOrder.length - 1
    ) {

        currentQuestion++;

        loadQuestion();

        window.scrollTo(
            0,
            0
        );

    }

    else {

        alert(
            "🎉 已經完成所有題目！"
        );


        backToHome();

    }

}



/* ==========================================
   回首頁
========================================== */

function backToHome() {

    quizPage.classList.add(
        "hidden"
    );


    homePage.classList.remove(
        "hidden"
    );


    window.scrollTo(
        0,
        0
    );

}



/* ==========================================
   按鈕事件
========================================== */

randomButton.addEventListener(
    "click",
    function() {

        startRandomQuiz();

    }
);


answerButton.addEventListener(
    "click",
    function() {

        showFullAnswer();

    }
);


/*
 * ⭐ 這裡是最重要的地方
 *
 * 直接使用 click。
 *
 * 不使用 touchstart。
 * 不使用 touchend。
 * 不使用全域 touchend 攔截。
 *
 * 這樣快速連點時，
 * 每一次 click 都可以正常執行。
 */

hintButton.addEventListener(
    "click",
    function() {

        showNextCharacter();

    }
);


nextButton.addEventListener(
    "click",
    function() {

        nextQuestion();

    }
);


backButton.addEventListener(
    "click",
    function() {

        backToHome();

    }
);



/* ==========================================
   iPhone Safari 手勢處理
========================================== */

/*
 * 不攔截 touchend。
 *
 * 不攔截 dblclick。
 *
 * 不會影響快速按鈕。
 *
 * 只阻止 Safari 的 pinch gesture。
 */


document.addEventListener(
    "gesturestart",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gesturechange",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gestureend",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);



/* ==========================================
   初始化
========================================== */

createQuestionList();

</script>
