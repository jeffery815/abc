<head>

        /* =================================
           基本設定
        ================================= */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;

            /* 只告訴瀏覽器這是一般操作 */
            touch-action: manipulation;
        }


        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: #f2f4f7;

            color: #222;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans TC",
                sans-serif;

            -webkit-user-select: none;
            user-select: none;

            -webkit-touch-callout: none;
        }


        /* =================================
           主容器
        ================================= */

        .container {
            width: 100%;
            max-width: 600px;

            margin: 0 auto;

            padding:
                20px
                16px
                50px;
        }


        /* =================================
           標題
        ================================= */

        h1 {
            text-align: center;

            font-size: 28px;

            margin:
                10px
                0
                25px;
        }


        /* =================================
           卡片
        ================================= */

        .card {
            background: white;

            border-radius: 18px;

            padding: 20px;

            margin-bottom: 18px;

            box-shadow:
                0 4px 14px
                rgba(0, 0, 0, 0.08);
        }


        /* =================================
           按鈕
        ================================= */

        button {
            display: block;

            width: 100%;

            min-height: 54px;

            padding:
                12px
                16px;

            margin-top: 10px;

            border: none;

            border-radius: 14px;

            font-size: 18px;

            font-weight: 600;

            cursor: pointer;

            background: #e9eef5;

            color: #222;

            /*
             * 這裡保留 manipulation，
             * 不再用 touchend 去攔截快速點擊。
             */
            touch-action: manipulation;

            -webkit-appearance: none;
            appearance: none;

            -webkit-user-select: none;
            user-select: none;

            -webkit-touch-callout: none;

            outline: none;

            -webkit-tap-highlight-color:
                transparent;

            transition:

.prev-btn {
    background: #64748b;

}

            font-size: 20px;

<script>

{

/* ==========================================
   測驗狀態
========================================== */

let currentQuestion = 0;

let quizOrder = [];

let revealedCount = 0;



/* ==========================================
   DOM
========================================== */

const homePage =
    document.getElementById("homePage");

const quizPage =
    document.getElementById("quizPage");

const questionList =
    document.getElementById("questionList");

const questionNumber =
    document.getElementById("questionNumber");

const questionText =
    document.getElementById("questionText");

const fullAnswer =
    document.getElementById("fullAnswer");

const hintAnswer =
    document.getElementById("hintAnswer");

const hintButton =
    document.getElementById("hintButton");

const answerButton =
    document.getElementById("answerButton");

const nextButton =
    document.getElementById("nextButton");
    
const prevButton =
    document.getElementById("prevButton");
    
const backButton =
    document.getElementById("backButton");

const randomButton =
    document.getElementById("randomButton");



/* ==========================================
   建立題目選單
========================================== */

function createQuestionList() {

    questionList.innerHTML = "";


    questions.forEach(
        function(item, index) {

            const button =
                document.createElement("button");


            button.type = "button";

            button.className =
                "question-btn";


            button.textContent =
                "第 " +
                (index + 1) +
                " 題";


            button.addEventListener(
                "click",
                function() {

                    startQuiz(index);

                }
            );


            questionList.appendChild(button);

        }
    );

}



/* ==========================================
   開始題目
========================================== */

function startQuiz(index) {

    quizOrder =
        questions.map(
            function(_, i) {
                return i;
            }
        );


    currentQuestion = index;


    showQuizPage();

}



/* ==========================================
   隨機出題
========================================== */

function startRandomQuiz() {

    quizOrder =
        questions.map(
            function(_, i) {
                return i;
            }
        );


    shuffleArray(quizOrder);


    currentQuestion = 0;


    showQuizPage();

}



/* ==========================================
   洗牌
========================================== */

function shuffleArray(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

}



/* ==========================================
   顯示測驗頁
========================================== */

function showQuizPage() {

    homePage.classList.add(
        "hidden"
    );


    quizPage.classList.remove(
        "hidden"
    );


    loadQuestion();


    window.scrollTo(
        0,
        0
    );

}



/* ==========================================
   載入題目
========================================== */

function loadQuestion() {

    const questionIndex =
        quizOrder[currentQuestion];


    const item =
        questions[questionIndex];


    questionNumber.textContent =
        "第 " +
        (currentQuestion + 1) +
        " / " +
        quizOrder.length +
        " 題";


    questionText.textContent =
        item.question;


    /* 清除完整答案 */

    fullAnswer.textContent = "";

    fullAnswer.classList.add(
        "hidden"
    );


    /* 清除提示 */

    hintAnswer.textContent = "";

    hintAnswer.classList.add(
        "hidden"
    );


    revealedCount = 0;


    hintButton.textContent =
        "🟡 一個字一個字提示";

}



/* ==========================================
   完整答案
========================================== */

function showFullAnswer() {

    const questionIndex =
        quizOrder[currentQuestion];


    const answer =
        questions[questionIndex].answer;


    fullAnswer.textContent =
        answer;


    fullAnswer.classList.remove(
        "hidden"
    );

}



/* ==========================================
   判斷是否為標點
========================================== */

function isPunctuation(char) {

    return /[\s.,!?，。！？、；：：「」『』（）()【】《》〈〉…—\-_]/.test(
        char
    );

}



/* ==========================================
   產生提示文字
========================================== */

function buildHint(answer, count) {

    let result = "";


    for (
        let i = 0;
        i < answer.length;
        i++
    ) {

        const char =
            answer[i];


        /*
         * 已經顯示
         */

        if (i < count) {

            result += char;

        }


        /*
         * 標點符號自動顯示
         */

        else if (
            isPunctuation(char)
        ) {

            result += char;

        }


        /*
         * 尚未顯示
         */

        else {

            result += "＿";

        }

    }


    return result;

}



/* ==========================================
   一個字一個字提示
========================================== */

function showNextCharacter() {

    const questionIndex =
        quizOrder[currentQuestion];


    const answer =
        questions[questionIndex].answer;


    hintAnswer.classList.remove(
        "hidden"
    );


    /*
     * 先跳過標點
     */

    while (
        revealedCount < answer.length &&
        isPunctuation(
            answer[revealedCount]
        )
    ) {

        revealedCount++;

    }


    /*
     * 已經完成
     */

    if (
        revealedCount >= answer.length
    ) {

        hintAnswer.textContent =
            answer;


        hintButton.textContent =
            "✅ 已全部提示";


        return;

    }


    /*
     * 顯示一個字
     */

    revealedCount++;


    /*
     * 顯示完這個字後，
     * 直接跳過後面的標點
     */

    while (
        revealedCount < answer.length &&
        isPunctuation(
            answer[revealedCount]
        )
    ) {

        revealedCount++;

    }


    /*
     * 更新畫面
     */

    hintAnswer.textContent =
        buildHint(
            answer,
            revealedCount
        );


    /*
     * 完成
     */

    if (
        revealedCount >= answer.length
    ) {

        hintButton.textContent =
            "✅ 已全部提示";

    }

}



/* ==========================================
   下一題
========================================== */

function nextQuestion() {

    if (
        currentQuestion <
        quizOrder.length - 1
    ) {

        currentQuestion++;

        loadQuestion();

        window.scrollTo(
            0,
            0
        );

    }

    else {

        alert(
            "🎉 已經完成所有題目！"
        );


        backToHome();

    }

}

/* ==========================================
   上一題
========================================== */

function prevQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        loadQuestion();

        window.scrollTo(
            0,
            0
        );

    }

    else {

        alert("你在第一題！");

    }

}

/* ==========================================
   回首頁
========================================== */

function backToHome() {

    quizPage.classList.add(
        "hidden"
    );


    homePage.classList.remove(
        "hidden"
    );


    window.scrollTo(
        0,
        0
    );

}



/* ==========================================
   按鈕事件
========================================== */

randomButton.addEventListener(
    "click",
    function() {

        startRandomQuiz();

    }
);


answerButton.addEventListener(
    "click",
    function() {

        showFullAnswer();

    }
);


/*
 * ⭐ 這裡是最重要的地方
 *
 * 直接使用 click。
 *
 * 不使用 touchstart。
 * 不使用 touchend。
 * 不使用全域 touchend 攔截。
 *
 * 這樣快速連點時，
 * 每一次 click 都可以正常執行。
 */

hintButton.addEventListener(
    "click",
    function() {

        showNextCharacter();

    }
);


nextButton.addEventListener(
    "click",
    function() {

        nextQuestion();

    }
);

prevButton.addEventListener(
    "click",
    function() {

        prevQuestion();

    }
);

backButton.addEventListener(
    "click",
    function() {

        backToHome();

    }
);



/* ==========================================
   iPhone Safari 手勢處理
========================================== */

/*
 * 不攔截 touchend。
 *
 * 不攔截 dblclick。
 *
 * 不會影響快速按鈕。
 *
 * 只阻止 Safari 的 pinch gesture。
 */


document.addEventListener(
    "gesturestart",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gesturechange",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gestureend",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);



/* ==========================================
   初始化
========================================== */

createQuestionList();

</script>

  quiz.insertAdjacentElement('afterend', page);
  page.querySelector('.question').textContent = title;
  const full = page.querySelector('#extraFullAnswer');
  const hint = page.querySelector('#extraHintAnswer');
  const hintBtn = page.querySelector('#extraHint');
  const chars = Array.from(answer);
  let count = 0;
  const punctuation = /[\s.,!?，。！？、；：：「」『』（）()〖〗《》〈〉…—\-_]/;
  btn.addEventListener('click', () => {
    count = 0;
    full.textContent = '';
    full.classList.add('hidden');
    hint.textContent = '';
    hint.classList.add('hidden');
    hintBtn.textContent = '🟡 一個字一個字提示';
    home.classList.add('hidden');
    quiz.classList.add('hidden');
    page.classList.remove('hidden');
    window.scrollTo(0, 0);
  });
  page.querySelector('#extraShowAnswer').addEventListener('click', () => {
    full.textContent = answer;
    full.classList.remove('hidden');
  });
  hintBtn.addEventListener('click', () => {
    if (count >= chars.length) return;
    count++;
    while (count < chars.length && punctuation.test(chars[count])) count++;
    hint.textContent = chars.slice(0, count).join('');
    hint.classList.remove('hidden');
    if (count >= chars.length) hintBtn.textContent = '✅ 提示完成';
  });
  page.querySelector('#extraBack').addEventListener('click', () => {
    page.classList.add('hidden');
    quiz.classList.add('hidden');
    home.classList.remove('hidden');
    window.scrollTo(0, 0);
  });
})();
</script>

</body>

</html>
